[workspace]
resolver = "3"
members = [
    "crates/s3d-types",
    "crates/s3d-disk",
    "crates/s3d-model",
    "crates/s3d-engine",
    "crates/s3d-proto",
    "crates/s3d-server",
    "crates/s3d-check",
    "crates/s3d-bench",
    "crates/s3d-fuzz",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
s3d-types = { path = "crates/s3d-types" }
s3d-disk = { path = "crates/s3d-disk" }
s3d-model = { path = "crates/s3d-model" }
s3d-engine = { path = "crates/s3d-engine" }
s3d-proto = { path = "crates/s3d-proto" }
s3d-server = { path = "crates/s3d-server" }

base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
crc32fast = "1"
crc64fast-nvme = "1"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "client-legacy"] }
libc = "0.2"
loom = "0.7"
md-5 = "0.10"
proptest = "1"
quick-xml = "0.37"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
shuttle = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
